spring.application.name=KFPCL_BACKEND_TEST
server.port=0

# H2 In-Memory Database Configuration for fast, independent testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Session Configuration
app.session.cookie-name=KFPCL_SESSION_ID
app.session.timeout-hours=8
app.session.cookie-secure=false
app.session.same-site=Lax

# OTP Configuration
app.otp.expiry-minutes=10
app.otp.max-send-attempts-per-hour=5
app.otp.max-verify-attempts=5

# SMS Provider for Testing
app.sms.provider=mock

file.upload.dir=target/test-uploads/
