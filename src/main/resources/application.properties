# Application Name
spring.application.name=KFPCL_BACKEND

# Server Port (configurable via AWS PORT env variable, defaults to 8080 for ECS target group)
server.port=${PORT:8080}

# Database Configuration (Supports AWS ECS RDS env variables DB_URL, DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD with local PostgreSQL fallbacks)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kfpcl_db12}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate Configuration
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Credentials are deliberately not configured here. ECS supplies them through the task role.
aws.s3.bucket=${AWS_S3_BUCKET:kfpcl-backend-images-2026}
aws.s3.region=${AWS_REGION:ap-south-1}

