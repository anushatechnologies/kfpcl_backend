# Application Configuration
spring.application.name=KFPCL_BACKEND
server.port=8080

# PostgreSQL Database Configuration (Production/Dev)
spring.datasource.url=jdbc:postgresql://localhost:5432/authentication_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration (Server-Side Session)
app.session.cookie-name=KFPCL_SESSION_ID
app.session.timeout-hours=8
app.session.cookie-secure=false
app.session.same-site=Lax

# OTP Configuration
app.otp.expiry-minutes=10
app.otp.max-send-attempts-per-hour=5
app.otp.max-verify-attempts=5

# SMS Provider Configuration (options: mock, twilio, msg91, fast2sms)
app.sms.provider=mock
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-phone=${TWILIO_FROM_PHONE:}
app.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
app.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}
app.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
